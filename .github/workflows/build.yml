# Build spod on pull requests — entirely in podman, no toolchain on the
# runner. Tag releases live in release.yml (GitHub-specific by design).
# The `test` target runs the full Go test suite in-container (a failing test
# fails the build); the `binary` target is a scratch stage emitting one fully
# static binary, parameterized by the GOARCH build-arg (amd64, arm64, riscv64,
# 386, arm — zig cc cross-compilation in-container), so release.yml builds
# every architecture from a single Containerfile.
#
# Local validation before this runs on GitHub (act 0.2.89 + the user podman
# socket; the -self-hosted label runs steps directly on the host, so `podman`
# in steps hits the real host podman — no nested containers):
#   export DOCKER_HOST=unix:///run/user/1000/podman/podman.sock
#   act pull_request -P ubuntu-latest=-self-hosted
#   # tag simulation — event file in /tmp, never inside the repo:
#   #   {"ref":"refs/tags/v0.0.0-act","before":"<sha>","after":"<sha>"}

# Trigger policy — build ONCE, at the moment that matters:
#   · PRs targeting main run test + binary-amd64 as check runs (gate merges
#     via branch protection on main). With protection on, every main commit
#     is a checked PR merge — so there is NO rebuild on main pushes; that
#     would duplicate the PR run.
#   · v* tags never run this workflow: the tag push is handled end to end
#     by release.yml, which builds the artifacts from the tagged commit
#     and creates the release.

name: Build

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]

# Iterate on a PR without stacking runs: a new push cancels the previous run
# for the same PR (tag runs are never superseded).
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Test suite (Containerfile `test` target) ─────────────────────────────
  # No Go on the runner: the suite runs in the golang container, and the
  # build's exit code is the test result.
  test:
    name: Test suite (in-container)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run the test suite in-container
        run: podman build --target test .

  # ── amd64 binary (merge-gating build check) ──────────────────────────────
  # Proves the artifact path end-to-end on the default GOARCH: scratch-stage
  # extraction, a runnable binary, and static linkage (CGO against musl via
  # zig cc).
  binary-amd64:
    name: Binary (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the amd64 binary
        # --target binary is the scratch stage holding only /spod; emitting
        # the default (runtime) stage would export an entire alpine rootfs.
        run: podman build --target binary --output type=local,dest=dist/amd64 .

      - name: Smoke-run and verify the binary
        run: |
          test -x dist/amd64/spod || { echo "::error::no binary at dist/amd64/spod"; exit 1; }
          ./dist/amd64/spod --version
          file dist/amd64/spod
          # Fully static by construction; assert it, accepting the two
          # spellings `file` uses (classic static and static-pie).
          file dist/amd64/spod | grep -qE "statically linked|static-pie linked" \
            || { echo "::error::spod is not statically linked"; exit 1; }

