# Tag-triggered release pipeline. GitHub-specific by design — this is the
# one file to replace or delete when porting to another forge; build.yml
# stays forge-neutral.
#
# A pushed v* tag is the whole release act: every supported GOARCH is
# rebuilt from the tagged commit (release artifacts are never promoted
# from a PR run), verified, and attached to an auto-created release.
#
# spod ships Linux targets only. The engine needs the Linux kernel —
# user namespaces and runc/libcontainer — so darwin/windows binaries
# would be nonfunctional artifacts, not portability gaps.
#
# Local validation before this runs on GitHub (from a clean clone):
#   export DOCKER_HOST=unix:///run/user/1000/podman/podman.sock
#   act push -e /tmp/tag-event.json -P ubuntu-latest=-self-hosted
#   #   {"ref":"refs/tags/v0.0.0-act","before":"<sha>","after":"<sha>"}
# The publish step is skipped under act (no token there).

name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    name: Build and publish the release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build every supported GOARCH
        run: |
          for goarch in amd64 arm64 riscv64 386 arm; do
            podman build --build-arg GOARCH=$goarch --target binary --output type=local,dest=dist/$goarch .
            mkdir -p dist/out/spod-linux-$goarch
            cp dist/$goarch/spod dist/out/spod-linux-$goarch/spod
          done

      - name: Verify the binaries
        run: |
          file dist/out/*/spod
          ./dist/out/spod-linux-amd64/spod --version

      - name: Create the release with the binaries attached
        # Skipped under act (no token); on GitHub the tag push publishes.
        if: env.GITHUB_TOKEN != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/out/*/* --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" dist/out/*/* --clobber
